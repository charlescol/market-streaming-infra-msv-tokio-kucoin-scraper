name: Build and Deploy to GCP Artifact Registry

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Ensure tag points to main
        run: |
          git fetch origin main
          TAG_COMMIT=$(git rev-list -n 1 $GITHUB_REF)
          MAIN_COMMIT=$(git rev-parse origin/main)
          if [ "$TAG_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "❌ Tag does not point to HEAD of main"
            exit 1
          fi

      - name: Fetch SSH key
        run: |
          mkdir -p .ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > .ssh/id_rsa
          chmod 600 .ssh/id_rsa

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY_FILE }}"

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Extract tag version
        id: extract_tag_version
        run: |
          echo "Tag is $GITHUB_REF"
          TAG_VERSION=$(echo "${GITHUB_REF##*/}" | sed 's/^v//')
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/msv-tokio-kucoin-scraper:${{ env.TAG_VERSION }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ github.ref_name }}
